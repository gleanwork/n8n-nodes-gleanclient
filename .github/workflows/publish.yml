# Publishes the package to npm with provenance.
# Provenance (a signed, verifiable build attestation) is required for n8n
# Creator Portal verification and must run in GitHub Actions with id-token: write.
# Requires an NPM_TOKEN repo secret (automation token for the @gleanwork org).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to generate npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # mise provides the copy-icons task used by the build script
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
