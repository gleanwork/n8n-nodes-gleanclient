# Static security analysis (CodeQL) for the TypeScript sources.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 7 * * 1' # weekly, Monday — off the :00 mark

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
