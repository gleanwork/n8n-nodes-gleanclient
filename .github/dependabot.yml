version: 2

updates:
  # npm dependencies (addresses the vulnerabilities flagged on the default branch).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait 14 days after an upstream release before proposing it, so
    # unpublished/compromised fresh versions get shaken out first.
    cooldown:
      default-days: 14
    assignees:
      - ashish-kumar2-glean
      - chris-freeman-glean
    groups:
      # All npm deps here are dev deps, so this groups every npm update into one PR.
      # Minor/patch only — breaking majors come individually (or are ignored below).
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    # typescript + eslint are pinned by the @n8n/node-cli toolchain; skip their majors.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  # Keep the GitHub Actions used by these workflows patched.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']
    assignees:
      - ashish-kumar2-glean
      - chris-freeman-glean
